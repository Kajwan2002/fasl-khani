<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فصل‌خوانی · چهار فصل، یک کتابخانه</title>
<meta name="description" content="برنامه‌ی کتاب‌خوانی هفته‌ای یک کتاب، با حال‌وهوای هر فصل">
<meta name="theme-color" content="#4a2224">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فصل‌خوانی">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/vazirmatn/files/vazirmatn-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body data-season="autumn">

<!-- dreamy world -->
<div class="world" aria-hidden="true">
  <div class="bg" data-s="autumn"></div>
  <div class="bg" data-s="winter"></div>
  <div class="bg" data-s="spring"></div>
  <div class="bg" data-s="summer"></div>
  <div class="bg" data-s="reserve"></div>
  <div class="bg" data-s="audio"></div>
  <div class="stars"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="orb"></div>
  <div class="scenes" id="scenes"></div>
  <canvas id="fx"></canvas>
  <div class="grain"></div>
</div>

<div class="app">
  <header class="top">
    <div class="brand">فصل‌خوانی</div>
    <div class="total" id="total"></div>
    <button id="editBtn" class="editbtn" type="button" aria-pressed="false">ویرایش</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="فصل‌ها"></nav>

  <section class="hero" id="hero">
    <div class="en" id="heroEn"></div>
    <div class="row">
      <div>
        <h1 class="fa" id="heroFa"></h1>
        <p class="tag" id="heroTag"></p>
      </div>
      <div class="ring" id="ring"></div>
    </div>
  </section>

  <button class="next" id="next" type="button"></button>

  <main id="list" class="list" role="tabpanel"></main>

  <div class="addwrap">
    <button id="addBtn" class="addbtn" type="button">＋ افزودن کتاب</button>
    <form id="addForm" class="addform" hidden autocomplete="off">
      <input id="addTitle" type="text" maxlength="140" placeholder="اسم کتاب" enterkeyhint="done">
      <input id="addGenre" type="text" maxlength="60" placeholder="ژانر (اختیاری)">
      <input id="addNote" type="text" maxlength="80" placeholder="یادداشت (اختیاری)">
      <div class="addrow">
        <select id="addWeight" aria-label="سنگینی"><option>سبک</option><option selected>متوسط</option><option>سنگین</option></select>
        <select id="addSeason" aria-label="فصل" hidden><option value="autumn">پاییز</option><option value="winter">زمستان</option><option value="spring">بهار</option><option value="summer">تابستان</option></select>
      </div>
      <div class="addrow"><button id="addOk" type="submit">اضافه کن</button><button id="addCancel" type="button">بی‌خیال</button></div>
      <div id="addMsg" class="addmsg" role="status"></div>
    </form>
  </div>

  <footer class="foot">
    <div class="sync" id="sync">
      <div id="syncStatus" class="iomsg st" role="status">همگام‌سازی خاموشه</div>
      <button id="syncBtn" type="button">ورود با گوگل</button>
      <details id="syncMail">
        <summary>یا با ایمیل و رمز</summary>
        <input id="syncEmail" type="email" dir="ltr" autocomplete="email" autocapitalize="none" placeholder="email">
        <input id="syncPass" type="password" dir="ltr" autocomplete="current-password" placeholder="password">
        <div class="io"><button id="syncLogin" type="button">ورود</button><button id="syncSignup" type="button">ساخت حساب</button></div>
      </details>
      <button id="syncOut" type="button" hidden>خروج از همگام‌سازی</button>
      <div id="syncMsg" class="iomsg" role="status"></div>
    </div>
    <div class="io">
      <button id="export" type="button">خروجی گرفتن</button>
      <button id="import" type="button">ورودی (فایل جدید)</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
    <div id="ioMsg" class="iomsg" role="status"></div>
    <button id="defaults" type="button">برگشت به لیست اولیه</button>
    <button id="reset" type="button">پاک‌کردن همه‌ی تیک‌ها</button>
    <span class="tip">نگه‌داشتن روی یه کتاب و کشیدن = جابه‌جایی · «ویرایش» بالا = حذف</span>
    <span>هفته‌ای یک کتاب · ←  → برای عوض‌کردن فصل</span>
  </footer>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script type="module" src="sync.js"></script>
</body>
</html>
