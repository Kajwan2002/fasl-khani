<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فصل‌خوانی · چهار فصل، یک کتابخانه</title>
<meta name="description" content="برنامه‌ی کتاب‌خوانی هفته‌ای یک کتاب، با حال‌وهوای هر فصل">
<meta name="theme-color" content="#4a2224">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2a65a'/%3E%3Cpath d='M9 22V10l7 3 7-3v12l-7-3z' fill='%23fff7ea'/%3E%3C/svg%3E">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/vazirmatn/files/vazirmatn-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body data-season="autumn">

<!-- dreamy world -->
<div class="world" aria-hidden="true">
  <div class="bg" data-s="autumn"></div>
  <div class="bg" data-s="winter"></div>
  <div class="bg" data-s="spring"></div>
  <div class="bg" data-s="summer"></div>
  <div class="bg" data-s="reserve"></div>
  <div class="stars"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="orb"></div>
  <div class="scenes" id="scenes"></div>
  <canvas id="fx"></canvas>
  <div class="grain"></div>
</div>

<div class="app">
  <header class="top">
    <div class="brand">فصل‌خوانی</div>
    <div class="total" id="total"></div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="فصل‌ها"></nav>

  <section class="hero" id="hero">
    <div class="en" id="heroEn"></div>
    <div class="row">
      <div>
        <h1 class="fa" id="heroFa"></h1>
        <p class="tag" id="heroTag"></p>
      </div>
      <div class="ring" id="ring"></div>
    </div>
  </section>

  <button class="next" id="next" type="button"></button>

  <main id="list" class="list" role="tabpanel"></main>

  <footer class="foot">
    <div class="io">
      <button id="export" type="button">خروجی گرفتن</button>
      <button id="import" type="button">ورودی (فایل جدید)</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
    <div id="ioMsg" class="iomsg" role="status"></div>
    <button id="defaults" type="button">برگشت به لیست اولیه</button>
    <button id="reset" type="button">پاک‌کردن همه‌ی تیک‌ها</button>
    <span>هفته‌ای یک کتاب · ←  → برای عوض‌کردن فصل</span>
  </footer>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
